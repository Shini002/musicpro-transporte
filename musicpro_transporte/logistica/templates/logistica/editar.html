{% extends 'logistica/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">⚙️ Modificar Despacho: {{ despacho.codigo }}</h5>
                <span class="badge bg-warning text-dark">{{ despacho.estado }}</span>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado del Traslado</label>
                            <select name="estado" class="form-select">
                                {% for estado in estados_disponibles %}
                                    <option value="{{ estado }}" {% if despacho.estado == estado %}selected{% endif %}>
                                        {{ estado }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estimación de Llegada (ETA)</label>
                            <input type="text" name="eta" class="form-control" value="{{ despacho.eta }}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Sucursal de Destino</label>
                            <input type="text" name="destino" class="form-control" value="{{ despacho.destino }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Conductor Asignado</label>
                            <input type="text" name="conductor" class="form-control" value="{{ despacho.conductor }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Patente de Vehículo</label>
                            <input type="text" name="patente" class="form-control" value="{{ despacho.patente }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Peso Carga (kg)</label>
                            <input type="number" step="0.1" name="peso" class="form-control" value="{{ despacho.peso_kg }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Capacidad Máxima (kg)</label>
                            <input type="number" step="0.1" name="capacidad" class="form-control" value="{{ despacho.capacidad_kg }}" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'despachos' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning fw-semibold">Actualizar Despacho</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
